set-option -g default-shell /bin/zsh
set -g default-terminal "xterm-kitty"

# Name unnamed sessions after their starting folder, adding a suffix for duplicates.
set-hook -g after-new-session {
    if-shell -F '#{==:#{hook_flag_s},}' {
        run-shell 'base=$(printf "%s" #{b;q:session_path} | tr ".:" "__")
            case "$base" in ""|/) base=root ;; esac
            name=$base
            suffix=1
            while [ "$name" != #{q:session_name} ] && tmux -S #{q:socket_path} has-session -t "=$name" 2>/dev/null; do
                name="$base-$suffix"
                suffix=$((suffix + 1))
            done
            tmux -S #{q:socket_path} rename-session -t #{q:session_id} -- "$name"'
    }
}

# Change prefix key
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# Set 24-bit colors
set-option -sa terminal-overrides ",xterm*:Tc"
set-option -as terminal-features "xterm-kitty:extkeys"
set-option -as terminal-features "*:extkeys"
set -g extended-keys on
# Pass Shift+Enter from kitty as CSI-u (handled in kitty mapping)

# Enable mouse
set -g mouse on

# Enable copy mode
setw -g mode-keys vi

# Configure vim shortcuts for copy paste
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel

# Start numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Window navigation
bind -n M-H previous-window
bind -n M-L next-window
bind C-H swap-window -t -1\; previous-window
bind C-L swap-window -t +1\; next-window

# Open new panes and windows in CWD
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind 'c' new-window -c "#{pane_current_path}"

# Clear terminal
bind -n C-M-l send-keys C-l

# Remove pane top border status
set-option -g pane-border-status off

# Configure catpuccin
set -g @catppuccin_user "on"
set -g @catppuccin_host "on"

# Remove close window and pane confirmations
bind-key x kill-pane
bind-key & kill-window

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Change window status name
setw -g window-status-format "#[fg=#1e1e2e,bg=#89b4fa] #I #[fg=#cdd6f4,bg=#313244] #{b:pane_current_path}/#{pane_current_command} "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa] #I #[fg=#cdd6f4,bg=#313244] #{b:pane_current_path}/#{pane_current_command} "

run-shell /home/andrejf/Documents/Projects/tmux-agents/tmux-agents.tmux
