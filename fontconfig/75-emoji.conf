<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Use Noto Color Emoji as a fallback for text fonts</description>

  <!-- Keep preferred text fonts first, then use a complete emoji font
       before falling back to unrelated icon fonts such as Font Awesome. -->
  <alias>
    <family>sans-serif</family>
    <accept>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias>
    <family>serif</family>
    <accept>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias>
    <family>monospace</family>
    <accept>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
</fontconfig>
